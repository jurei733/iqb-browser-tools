map_hash_bucket_size 128;
# Only the local browser port and the existing private Site may call this demo API.
map $http_origin $demo_origin {
  default "";
  "http://127.0.0.1:5190" $http_origin;
  "http://localhost:5190" $http_origin;
  "http://127.0.0.1:5191" $http_origin;
  "https://iqb-browser-port-jr-20261022.reichlej88.chatgpt.site" $http_origin;
}
error_log /dev/stdout;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
  listen 8080;
  listen [::]:8080;
  server_name localhost;
  server_tokens off;

  access_log /dev/null;

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
  }

  location /index.html {
    root /usr/share/nginx/html;

    add_header Cache-Control no-store;
    expires 0;

    set $CSP "";
    set $CSP "${CSP} frame-ancestors 'none';";
    set $CSP "${CSP} frame-src 'self';";
    set $CSP "${CSP} default-src 'self' data:;";
    set $CSP "${CSP} child-src 'self' 'unsafe-inline' blob:;";
    set $CSP "${CSP} img-src 'self' data: blob:;";
    set $CSP "${CSP} media-src 'self' data:;";
    set $CSP "${CSP} worker-src 'self' blob:;";
    set $CSP "${CSP} script-src 'self' 'unsafe-inline' https: http: 'unsafe-eval';"; # last 3 are needed by GeoGebra
    set $CSP "${CSP} style-src 'self' 'unsafe-inline';";
    set $CSP "${CSP} font-src 'self' data:;";
    set $CSP "${CSP} connect-src 'self' data: https://api.github.com;";
    # upgrade-insecure-requests; can not be set because the textcenter must be usable via HTTP in local setups
    # block-all-mixed-content same
    add_header Content-Security-Policy $CSP;
  }

  error_page 500 502 503 504  /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
    internal;
  }

  # Healthcheck
  location /health {
    access_log off;
    add_header 'Content-Type' 'application/json';
    return 200 'healthy';
  }

  # Broadcaster: only the websocket is public, all other routes are for the backend only
  location = /bs/public/ws {
    proxy_pass http://broadcaster:3000/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  # File Server
  location /fs/ {
    proxy_pass http://file-server:8080/;
  }

  # Backend
  location /api/ {
    add_header Access-Control-Allow-Origin $demo_origin always;
    add_header Vary Origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "AuthToken, Content-Type, Accept" always;
    add_header Access-Control-Expose-Headers "Error-ID, Test-Mode" always;
    if ($request_method = OPTIONS) { return 204; }

    client_max_body_size 2G;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_pass http://backend:8080/;
  }
}
