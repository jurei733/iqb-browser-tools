name: Windows original reference
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    name: Run unchanged Windows originals on x64 hardware
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: node scripts/prepare-native-windows.mjs
      - name: Download pinned originals and capture x86, x64 and CodingResults outputs
        shell: powershell
        run: ./scripts/Run-Native-Windows.ps1 -Root work/native-windows
      - name: Emit lossless synthetic reference bundle
        if: ${{ !cancelled() }}
        run: node scripts/bundle-native-windows.mjs
      - name: Compare current browser code and expose documented x86 text gaps
        run: node scripts/compare-native-windows.mjs work/native-windows/bundle.json work/native-windows/comparison.json --allow-documented-x86-gap
      - name: Retain synthetic native reference files
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-native-reference
          path: work/native-windows/*.json
          retention-days: 14
